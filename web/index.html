<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Binary analysis</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app-layout" id="app-layout"><button id="history-toggle" class="history-toggle" type="button" aria-controls="history-sidebar" aria-expanded="true" aria-label="Collapse analysis history" title="Collapse analysis history">‹</button><aside class="history-sidebar" id="history-sidebar"><div class="history-heading"><h2>Analysis history</h2><button id="saved" class="text-button" type="button" aria-label="Refresh analysis history">↻</button></div><div id="history-list" aria-live="polite"></div></aside><main>

<section class="panel setup"><div class="section-title"><h1>Binary analysis</h1><span class="panel-index">INPUT</span></div>
<form id="analysis-form"><label for="binary">Binary file<input id="binary" type="file" required aria-describedby="upload-status"><span id="upload-status" role="status" aria-live="polite">Select a binary · max 50 MB</span></label><label for="target">Target function<select id="target" required disabled><option value="">Upload a binary first</option></select><span id="function-note" class="function-note" role="status" hidden></span></label><button class="primary" id="run" type="submit" disabled>Analyze <span>↗</span></button></form>
<div class="setup-foot"><button class="text-button" id="functions" type="button" disabled>Load functions ↻</button><span class="runtime-note">Executes locally · trusted binaries only</span></div></section>
<div id="error" role="alert" hidden></div>
<section class="progress panel" aria-label="Analysis progress"><div class="progress-heading"><h2>Progress</h2><span id="session-state" role="status" aria-live="polite">Ready</span></div><div class="pipeline"><div class="stage" data-stage="static"><i></i><span>Static analysis</span><span class="stage-state">Ready</span></div><div class="stage" data-stage="dynamic"><i></i><span>Dynamic analysis</span><span class="stage-state">Ready</span></div><div class="stage" data-stage="judge"><i></i><span>Judge</span><span class="stage-state">Waiting</span></div><div class="stage" data-stage="experiment" hidden><i></i><span>Experiment</span><span class="stage-state">Waiting</span></div></div></section>
<div class="results-toolbar"><h2>Results</h2></div>
<section id="trace-controls" class="panel trace-controls" hidden><div class="trace-toolbar"><button id="trace-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="trace-panel">Trace</button><a id="trace-download" class="text-button" download="trace.jsonl" hidden>↓ JSONL</a></div><div id="trace-panel" hidden><ol id="trace-events"></ol></div></section>
<div id="results" hidden><section class="panel verdict-panel"><div class="section-title"><h2>Verdict</h2><button id="export" class="text-button" disabled>↓ Export JSON</button></div><div id="verdict-content" class="result-body"></div></section>
<section class="results-grid"><article class="panel"><div class="section-title"><h2>Static analysis</h2></div><div id="static-content" class="result-body"></div></article><article class="panel"><div class="section-title"><h2>Dynamic analysis</h2></div><div id="dynamic-content" class="result-body"></div></article></section></div>
</main></div><script src="/app.js"></script></body></html>
